name: Infra & Metadata Consistency Check

on:
  push:
    branches: [main, consolidation-pattern]
  pull_request:
    branches: [main, consolidation-pattern]

jobs:
  metadata-check:
    name: Hasura Metadata Consistency
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Hasura CLI
        run: |
          sudo curl -fL https://github.com/hasura/graphql-engine/releases/download/v2.47.0/cli-hasura-linux-amd64 -o /usr/local/bin/hasura
          sudo chmod +x /usr/local/bin/hasura
          hasura version --skip-update-check

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Set up environment
        run: |
          cp infra/backend/.env.example infra/backend/.env
          sed -i 's/POSTGRES_PASSWORD=replace-with-a-local-password/POSTGRES_PASSWORD=postgrespassword/' infra/backend/.env
          sed -i 's/HASURA_GRAPHQL_ADMIN_SECRET=replace-with-a-local-admin-secret/HASURA_GRAPHQL_ADMIN_SECRET=myadminsecretkey/' infra/backend/.env
          sed -i 's/HASURA_EVENT_SECRET=replace-with-a-local-event-secret/HASURA_EVENT_SECRET=myhasuraeventsecret/' infra/backend/.env
          sed -i 's/WEBHOOK_ADMIN_SECRET=replace-with-a-local-webhook-admin-secret/WEBHOOK_ADMIN_SECRET=mywebhookadminsecret/' infra/backend/.env
          sed -i 's/RECONCILIATION_SECRET=replace-with-a-random-cron-secret/RECONCILIATION_SECRET=myreconciliationsecret/' infra/backend/.env
          sed -i 's/FIREBASE_SEED_USERS=true/FIREBASE_SEED_USERS=false/' infra/backend/.env

      - name: Start SafeTrust and hotel backend infrastructure
        run: |
          cd infra/backend
          bin/start safetrust hotel_industry

      - name: Verify Hasura metadata consistency
        run: |
          make metadata-check

      - name: Verify hotel permission isolation
        run: |
          cd infra/backend
          bash tests/hotel-permissions.sh
