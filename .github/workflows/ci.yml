name: CI

on:
  push:
    branches: [consolidation-pattern, main]
  pull_request:
    branches: [consolidation-pattern, main]

jobs:
  ci:
    name: Build, Lint, Test & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyATM5BPZL9oNYfxuuuE7phGYJkqMYictnM' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'safetrustcr-596e3.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'safetrustcr-596e3' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'safetrustcr-596e3.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '736891312580' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:736891312580:web:2752bc815204c69fcbec91' }}
        run: pnpm --filter @safetrust/web build

      - name: Client secret scan
        if: github.event_name == 'push'
        env:
          TRUSTLESS_WORK_API_KEY: ${{ secrets.TRUSTLESS_WORK_API_KEY }}
          REQUIRE_BUNDLE_KEY: "true"
        run: bash scripts/check-client-secrets.sh

      - name: Client source scan (bundle key unavailable to pull requests)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-client-secrets.sh
