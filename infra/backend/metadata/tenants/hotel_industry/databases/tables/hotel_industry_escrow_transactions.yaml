table:
  name: escrow_transactions
  schema: hotel_industry
configuration:
  # Prefixed to avoid colliding with the safetrust source's own
  # public.escrow_transactions table in the unified GraphQL schema.
  custom_root_fields:
    select: hotel_escrow_transactions
    select_by_pk: hotel_escrow_transactions_by_pk
    select_aggregate: hotel_escrow_transactions_aggregate
    insert: insert_hotel_escrow_transactions
    insert_one: insert_hotel_escrow_transactions_one
    update: update_hotel_escrow_transactions
    update_by_pk: update_hotel_escrow_transactions_by_pk
    delete: delete_hotel_escrow_transactions
    delete_by_pk: delete_hotel_escrow_transactions_by_pk
object_relationships:
  - name: reservation
    using:
      foreign_key_constraint_on: reservation_id
array_relationships:
  - name: users
    using:
      foreign_key_constraint_on:
        table:
          name: escrow_transaction_users
          schema: hotel_industry
        columns:
          - escrow_transaction_id
# Scoped through reservation → room → hotel → owner.
select_permissions:
  - role: hotel_manager
    permission:
      columns:
        - id
        - reservation_id
        - contract_id
        - escrow_status
        - signer_address
        - transaction_type
        - escrow_transaction_type
        - http_status_code
        - escrow_payload
        - fund_payload
        - created_at
        - updated_at
      filter:
        reservation:
          room:
            hotel:
              owner:
                _and:
                  - firebase_uid:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: MANAGER
      allow_aggregations: true
  - role: hotel_staff
    permission:
      columns:
        - id
        - reservation_id
        - contract_id
        - escrow_status
        - signer_address
        - transaction_type
        - escrow_transaction_type
        - http_status_code
        - escrow_payload
        - fund_payload
        - created_at
        - updated_at
      filter:
        reservation:
          room:
            hotel:
              staff_memberships:
                user:
                  _and:
                    - firebase_uid:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: STAFF
      allow_aggregations: true
  - role: mcp_reader
    permission:
      columns:
        - id
        - reservation_id
        - contract_id
        - escrow_status
        - transaction_type
        - escrow_transaction_type
        - created_at
        - updated_at
      filter: {}
