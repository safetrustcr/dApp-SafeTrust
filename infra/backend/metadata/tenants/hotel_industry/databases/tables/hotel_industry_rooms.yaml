table:
  name: rooms
  schema: hotel_industry
configuration:
  custom_root_fields:
    select: rooms
    select_by_pk: rooms_by_pk
    select_aggregate: rooms_aggregate
    insert: insert_rooms
    insert_one: insert_rooms_one
    update: update_rooms
    update_by_pk: update_rooms_by_pk
    delete: delete_rooms
    delete_by_pk: delete_rooms_by_pk
object_relationships:
  - name: hotel
    using:
      foreign_key_constraint_on: hotel_id
  - name: room_type
    using:
      foreign_key_constraint_on: room_type_id
array_relationships:
  - name: images
    using:
      foreign_key_constraint_on:
        table:
          name: room_images
          schema: hotel_industry
        columns:
          - room_id
  - name: reservations
    using:
      foreign_key_constraint_on:
        table:
          name: reservations
          schema: hotel_industry
        columns:
          - room_id
# Scoped through the owning hotel.
select_permissions:
  - role: hotel_manager
    permission:
      columns:
        - room_id
        - hotel_id
        - room_number
        - room_type_id
        - price_night
        - capacity
        - is_available
        - created_at
        - updated_at
      filter:
        hotel:
          owner:
            _and:
              - firebase_uid:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: MANAGER
      allow_aggregations: true
  - role: hotel_staff
    permission:
      columns:
        - room_id
        - hotel_id
        - room_number
        - room_type_id
        - price_night
        - capacity
        - is_available
        - created_at
        - updated_at
      filter:
        hotel:
          staff_memberships:
            user:
              _and:
                - firebase_uid:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: STAFF
      allow_aggregations: true
  - role: mcp_reader
    permission:
      columns:
        - room_id
        - hotel_id
        - room_type_id
        - price_night
        - capacity
        - is_available
        - created_at
        - updated_at
      filter: {}
