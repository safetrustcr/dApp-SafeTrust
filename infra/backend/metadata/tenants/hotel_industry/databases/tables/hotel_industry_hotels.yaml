table:
  name: hotels
  schema: hotel_industry
configuration:
  custom_root_fields:
    select: hotels
    select_by_pk: hotels_by_pk
    select_aggregate: hotels_aggregate
    insert: insert_hotels
    insert_one: insert_hotels_one
    update: update_hotels
    update_by_pk: update_hotels_by_pk
    delete: delete_hotels
    delete_by_pk: delete_hotels_by_pk
object_relationships:
  - name: owner
    using:
      foreign_key_constraint_on: owner_user_id
array_relationships:
  - name: images
    using:
      foreign_key_constraint_on:
        table:
          name: hotel_images
          schema: hotel_industry
        columns:
          - hotel_id
  - name: rooms
    using:
      foreign_key_constraint_on:
        table:
          name: rooms
          schema: hotel_industry
        columns:
          - hotel_id
  - name: staff_memberships
    using:
      foreign_key_constraint_on:
        table:
          name: hotel_staff_memberships
          schema: hotel_industry
        columns:
          - hotel_id
# Read-only for clients. Writes go through apps/api (hotel CRUD issue).
# hotel_manager: only hotels whose owner is the signed-in Firebase user AND a MANAGER.
# Hasura admin access is built in; do not declare permissions for role admin.
select_permissions:
  - role: hotel_manager
    permission:
      columns:
        - id
        - owner_user_id
        - name
        - description
        - address
        - location_area
        - coordinates
        - created_at
        - updated_at
      filter:
        owner:
          _and:
            - firebase_uid:
                _eq: X-Hasura-User-Id
            - role:
                _eq: MANAGER
      allow_aggregations: true
  - role: hotel_staff
    permission:
      columns:
        - id
        - owner_user_id
        - name
        - description
        - address
        - location_area
        - coordinates
        - created_at
        - updated_at
      filter:
        staff_memberships:
          user:
            _and:
              - firebase_uid:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: STAFF
      allow_aggregations: true
  - role: mcp_reader
    permission:
      columns:
        - id
        - name
        - created_at
        - updated_at
      filter: {}
