table:
  name: hotels
  schema: hotel_industry
configuration:
  custom_root_fields:
    select: hotels
    select_by_pk: hotels_by_pk
    select_aggregate: hotels_aggregate
    insert: insert_hotels
    insert_one: insert_hotels_one
    update: update_hotels
    update_by_pk: update_hotels_by_pk
    delete: delete_hotels
    delete_by_pk: delete_hotels_by_pk
object_relationships:
  - name: owner
    using:
      foreign_key_constraint_on: owner_user_id
array_relationships:
  - name: rooms
    using:
      foreign_key_constraint_on:
        table:
          name: rooms
          schema: hotel_industry
        columns:
          - hotel_id
  - name: owner
    using:
      foreign_key_constraint_on: owner_user_id
select_permissions:
  - role: tenant
    permission:
      columns:
        - id
        - owner_user_id
        - name
        - description
        - address
        - location_area
        - coordinates
        - created_at
        - updated_at
        - owner_user_id
      filter: {}
  - role: landlord
    permission:
      columns:
        - id
        - owner_user_id
        - name
        - description
        - address
        - location_area
        - coordinates
        - created_at
        - updated_at
        - owner_user_id
      filter: {}
