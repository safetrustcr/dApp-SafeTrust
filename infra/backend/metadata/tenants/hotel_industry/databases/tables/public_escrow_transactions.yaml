table:
  name: escrow_transactions
  schema: public
object_relationships:
  - name: reservation
    using:
      foreign_key_constraint_on: reservation_id
  - name: users
    using:
      foreign_key_constraint_on:
        table:
          name: escrow_transaction_users
          schema: public
        columns:
          - escrow_transaction_id
select_permissions:
  - role: MANAGER
    permission:
      columns:
        - id
        - reservation_id
        - contract_id
        - escrow_status
        - signer_address
        - transaction_type
        - escrow_transaction_type
        - http_status_code
        - escrow_payload
        - fund_payload
        - created_at
        - updated_at
      filter:
        reservation:
          room:
            hotel:
              owner:
                firebase_uid:
                  _eq: X-Hasura-User-Id
  - role: STAFF
    permission:
      columns:
        - id
        - reservation_id
        - contract_id
        - escrow_status
        - signer_address
        - transaction_type
        - escrow_transaction_type
        - http_status_code
        - escrow_payload
        - fund_payload
        - created_at
        - updated_at
      filter:
        reservation:
          room:
            hotel:
              owner:
                firebase_uid:
                  _eq: X-Hasura-User-Id
  - role: platform_admin
    permission:
      columns:
        - id
        - reservation_id
        - contract_id
        - escrow_status
        - signer_address
        - transaction_type
        - escrow_transaction_type
        - http_status_code
        - escrow_payload
        - fund_payload
        - created_at
        - updated_at
      filter: {}