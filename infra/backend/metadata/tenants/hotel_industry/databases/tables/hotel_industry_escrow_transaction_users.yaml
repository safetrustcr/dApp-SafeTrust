table:
  name: escrow_transaction_users
  schema: hotel_industry
configuration:
  custom_root_fields:
    select: escrow_transaction_users
    select_by_pk: escrow_transaction_users_by_pk
    select_aggregate: escrow_transaction_users_aggregate
    insert: insert_escrow_transaction_users
    insert_one: insert_escrow_transaction_users_one
    update: update_escrow_transaction_users
    update_by_pk: update_escrow_transaction_users_by_pk
    delete: delete_escrow_transaction_users
    delete_by_pk: delete_escrow_transaction_users_by_pk
object_relationships:
  - name: escrow_transaction
    using:
      foreign_key_constraint_on: escrow_transaction_id
  - name: user
    using:
      foreign_key_constraint_on: user_email
select_permissions:
  - role: tenant
    permission:
      columns:
        - id
        - user_email
        - escrow_transaction_id
        - role
        - status
        - is_primary
        - funded_at
        - funding_status
        - created_at
        - updated_at
      filter: {}
  - role: landlord
    permission:
      columns:
        - id
        - user_email
        - escrow_transaction_id
        - role
        - status
        - is_primary
        - funded_at
        - funding_status
        - created_at
        - updated_at
      filter: {}
