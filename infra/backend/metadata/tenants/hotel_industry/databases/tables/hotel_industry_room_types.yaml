table:
  name: room_types
  schema: hotel_industry
configuration:
  custom_root_fields:
    select: room_types
    select_by_pk: room_types_by_pk
    select_aggregate: room_types_aggregate
    insert: insert_room_types
    insert_one: insert_room_types_one
    update: update_room_types
    update_by_pk: update_room_types_by_pk
    delete: delete_room_types
    delete_by_pk: delete_room_types_by_pk
array_relationships:
  - name: rooms
    using:
      foreign_key_constraint_on:
        table:
          name: rooms
          schema: hotel_industry
        columns:
          - room_type_id
select_permissions:
  - role: tenant
    permission:
      columns:
        - id
        - name
        - description
        - created_at
        - updated_at
      filter: {}
  - role: landlord
    permission:
      columns:
        - id
        - name
        - description
        - created_at
        - updated_at
      filter: {}
