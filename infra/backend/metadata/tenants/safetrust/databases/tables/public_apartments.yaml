table:
  name: apartments
  schema: public
object_relationships:
  - name: owner
    using:
      foreign_key_constraint_on: owner_id
select_permissions:
  - role: tenant
    permission:
      columns:
        - id
        - owner_id
        - name
        - description
        - price
        - warranty_deposit
        - coordinates
        - address
        - is_available
        - available_from
        - available_until
        - image_urls
        - created_at
        - updated_at
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - is_available:
              _eq: true
  - role: landlord
    permission:
      columns:
        - id
        - owner_id
        - name
        - description
        - price
        - warranty_deposit
        - coordinates
        - address
        - is_available
        - available_from
        - available_until
        - image_urls
        - created_at
        - updated_at
        - deleted_at
      filter:
        owner_id:
          _eq: X-Hasura-User-Id
  - role: mcp_reader
    permission:
      columns:
        - id
        - owner_id
        - name
        - price
        - warranty_deposit
        - is_available
        - available_from
        - available_until
        - created_at
        - updated_at
      filter:
        deleted_at:
          _is_null: true
  - role: guest
    permission:
      columns:
        - id
        - owner_id
        - name
        - description
        - price
        - warranty_deposit
        - coordinates
        - address
        - is_available
        - available_from
        - available_until
        - image_urls
        - created_at
        - updated_at
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - is_available:
              _eq: true
      allow_aggregations: true
  - role: host
    permission:
      columns:
        - id
        - owner_id
        - name
        - description
        - price
        - warranty_deposit
        - coordinates
        - address
        - is_available
        - available_from
        - available_until
        - image_urls
        - created_at
        - updated_at
        - deleted_at
      filter:
        owner_id:
          _eq: X-Hasura-User-Id
  # Signed-out visitors (HASURA_GRAPHQL_UNAUTHORIZED_ROLE=anonymous, #553):
  # the public listing feed only. No owner relationship access — the listing
  # adapter falls back to "Host" when owner is not visible.
  - role: anonymous
    permission:
      columns:
        - id
        - owner_id
        - name
        - description
        - price
        - warranty_deposit
        - coordinates
        - address
        - is_available
        - available_from
        - available_until
        - image_urls
        - created_at
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - is_available:
              _eq: true
      allow_aggregations: true
